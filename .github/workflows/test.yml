name: Read-only checker tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline behavioral tests in PowerShell 7
        shell: pwsh
        run: |
          ./tests/identity/Invoke-PimEligibilityTests.ps1 -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'pim-eligibility-tests-pwsh')
      - name: Run offline behavioral tests in Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/identity/Invoke-PimEligibilityTests.ps1 -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'pim-eligibility-tests-ps51')
      - name: Test launcher in PowerShell 7
        shell: pwsh
        run: ./tests/identity/Invoke-PimLauncherTests.ps1
      - name: Test launcher in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/identity/Invoke-PimLauncherTests.ps1
